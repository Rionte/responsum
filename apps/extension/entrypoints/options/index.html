<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Responsum options</title>
  </head>
  <body>
    <main class="options">
      <h1>Responsum options</h1>
      <label for="api-key">Anthropic API key</label>
      <input id="api-key" type="password" autocomplete="off" />
      <label for="model">Default model</label>
      <select id="model">
        <option value="balanced">Balanced (Sonnet) for summaries and plans</option>
        <option value="fast">Fast (Haiku) for quick questions</option>
      </select>
      <div class="row">
        <button id="save" class="primary">Save</button>
        <button id="test" class="ghost">Test key</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
